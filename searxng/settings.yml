# Instance SearXNG de ThinkTuning — montée dans /etc/searxng/settings.yml
# (service docker-compose « searxng », profil « search »).
#
# use_default_settings charge la configuration complète par défaut de
# l'image ; seules les clés ci-dessous sont surchargées.
use_default_settings: true

server:
  # P0 SEC (F14) — PAS de secret en dur : la stack SearXNG honore
  # $SEARXNG_SECRET (docs admin/settings_server : « secret_key $SEARXNG_SECRET
  # — Used for cryptography purpose »). Compose DOIT injecter SEARXNG_SECRET
  # (généré au setup, cf. docker-compose.yml) ; SANS la variable, SearXNG
  # refuse de démarrer (fail-closed) au lieu d'utiliser une clé publique.
  secret_key: "$SEARXNG_SECRET"
  # Instance locale réservée à l'agent : le limiter anti-bot renverrait
  # des 429 aux requêtes répétées de web_search.
  limiter: false

search:
  # « json » est REQUIS par l'outil web_search (format=json), sinon 403.
  formats:
    - html
    - json
  # Langue par défaut des résultats (surchargeable via AGENT_SEARCH_LANGUAGE).
  default_lang: fr
