services:
  train:
    build: ./backend
    image: thinktuning:latest
    container_name: thinktuning-train
    command: ["python", "train.py", "--max_per_lang", "500", "--epochs", "2", "--batch_size", "8"]
    environment:
      - OMP_NUM_THREADS=4
      - MKL_NUM_THREADS=4
    volumes:
      - ./backend/configs:/app/configs
      - ./backend/experiments:/app/experiments
      - hf-cache:/app/.cache

  predict:
    build: ./backend
    image: thinktuning:latest
    container_name: thinktuning-predict
    command: ["python", "predict.py", "Ce produit est fantastique, je recommande !"]
    volumes:
      - ./backend/experiments:/app/experiments
      - hf-cache:/app/.cache
    profiles: ["predict"]

  evaluate:
    build: ./backend
    image: thinktuning:latest
    container_name: thinktuning-evaluate
    command: ["python", "evaluate.py", "--max_per_lang", "500"]
    volumes:
      - ./backend/experiments:/app/experiments
      - hf-cache:/app/.cache
    profiles: ["evaluate"]

  calibrate:
    build: ./backend
    image: thinktuning:latest
    container_name: thinktuning-calibrate
    command: ["python", "calibrate.py", "--max_per_lang", "500"]
    volumes:
      - ./backend/experiments:/app/experiments
      - ./backend/outputs:/app/outputs
      - hf-cache:/app/.cache
    profiles: ["calibrate"]


  # Méta-moteur de recherche pour l'outil web_search de l'agent (profil
  # « search ») : docker compose --profile search up -d searxng
  # L'API JSON est activée dans searxng/settings.yml (search.formats).
  searxng:
    image: searxng/searxng:latest
    container_name: thinktuning-searxng
    # Relance automatique : l'agent compte sur cette instance pour web_search.
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8888/
    volumes:
      - ./searxng:/etc/searxng
    profiles: ["search"]


  app:
    build: ./backend
    image: thinktuning:latest
    container_name: thinktuning-app
    # init: true -> un process init récolte les zombies (gunicorn pré-fork).
    init: true
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=/app/experiments/models
      - API_KEY=${API_KEY}
      - JOB_STORE_PATH=/app/experiments/jobs.db
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:5173,http://localhost:3000}
      # Provider LLM de l'agent : « ollama » (défaut) ou « openrouter ».
      - AGENT_PROVIDER=${AGENT_PROVIDER:-ollama}
      - AGENT_MODEL_NAME=${AGENT_MODEL_NAME:-}
      - AGENT_OLLAMA_URL=${AGENT_OLLAMA_URL:-http://192.168.1.184:11434/api/chat}
      - AGENT_OPENROUTER_URL=${AGENT_OPENROUTER_URL:-https://openrouter.ai/api/v1/chat/completions}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      # Recherche web de l'agent : SearXNG (service « searxng » du réseau
      # compose) puis repli DuckDuckGo Lite. AGENT_PRIVATE_HOST_ALLOWLIST
      # exempte l'hôte SearXNG du blocage SSRF si AGENT_BLOCK_PRIVATE_HOSTS=1.
      - AGENT_SEARCH_BACKEND=${AGENT_SEARCH_BACKEND:-auto}
      - AGENT_SEARXNG_URL=${AGENT_SEARXNG_URL:-http://searxng:8080/search}
      - AGENT_SEARCH_LANGUAGE=${AGENT_SEARCH_LANGUAGE:-fr}
      - AGENT_PRIVATE_HOST_ALLOWLIST=${AGENT_PRIVATE_HOST_ALLOWLIST:-searxng,127.0.0.1,localhost}
    volumes:
      - ./backend/experiments:/app/experiments
      - hf-cache:/app/.cache
    profiles: ["app"]

  # ---------------------------------------------------------------------------
  # Dashboard React (Phase 5 — découplage déploiement) : image séparée, nginx
  # standalone qui proxifie /api/* vers le service « app » ci-dessus via le
  # template envsubst (frontend/templates/default.conf.template).
  # `--profile app up` démarre API + dashboard ; le healthcheck de l'image API
  # garantit que le dashboard n'arrive qu'avec une API prête.
  # ---------------------------------------------------------------------------
  dashboard:
    build: ./frontend
    image: thinktuning-dashboard:latest
    container_name: thinktuning-dashboard
    init: true
    environment:
      # Variables du template nginx (envsubst au DÉMARRAGE du conteneur,
      # cf. frontend/templates/default.conf.template) — pas des build args.
      - API_UPSTREAM=app:8000
      - FRONTEND_PORT=8080
    ports:
      - "8080:8080"
    depends_on:
      app:
        condition: service_healthy
    profiles: ["app"]

volumes:
  # Cache Hugging Face (modèle + dataset parquet) et cache NLTK,
  # persistant entre les runs pour éviter de re-télécharger à chaque fois.
  hf-cache: