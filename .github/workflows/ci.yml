name: CI

on:
  push:
    branches: ["main", "develop", "SCRUM-*"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  backend:
    name: Backend — Lint + types + tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Racine du projet Python : tous les run steps s'exécutent depuis backend/
    # (imports, pytest.ini, pyproject.toml, requirements.txt y résident).
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      # torch CPU d'abord (index dédié), puis le reste — même procédure que
      # le commentaire de requirements.txt, pour un CI léger sans CUDA.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      # Corpus NLTK pour l'augmentation EDA (synonymes WordNet via OMW).
      # Sans eux, _get_synonyms() avale silencieusement l'erreur et retourne
      # [] : synonym_replacement / random_insertion retombent sur le texte
      # original. Téléchargement visible mais non bloquant.
      - name: Pre-download NLTK corpora (wordnet, omw-1.4, punkt)
        run: |
          python -m nltk.downloader wordnet omw-1.4 punkt punkt_tab \
            || echo "::warning::NLTK corpora unavailable - EDA augmentation will run without synonyms"

      - name: Lint (ruff check — périmètre app/)
        run: |
          pip install "ruff==0.16.6"
          ruff check app/

      - name: Format (ruff format --check — périmètre app/)
        run: |
          ruff format --check app/

      - name: Types (mypy — périmètre app/ uniquement, cf. pyproject.toml)
        run: |
          pip install mypy
          mypy app/ || true  # progressif : durci à mesure de la migration

      - name: Tests (pytest)
        env:
          # NB : pas de API_KEY ici — conftest.py pose API_KEY=test-key pour
          # toute la session (aligné avec les en-têtes X-API-Key des tests).
          # Une valeur différente ici faisait échouer 134 tests en 401.
          AGENT_PROVIDER: ollama  # aucun appel réseau : les tests mockent le LLM
        run: |
          pip install pytest
          pytest tests/ -q --durations=10

  frontend:
    name: Frontend — types + tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Tests (vitest)
        run: npm test

      - name: Build (vite)
        run: npm run build

  # ==========================================================================
  # P2 lot 15 — Supply-chain (bloquant Haute/Critique)
  #   - pins digest Docker vérifiés contre Docker Hub (check_docker_pins.py) ;
  #   - pip-audit (Python) + npm audit (JS) : exit non-zéro dès High/Critical ;
  #   - trivy (scan FS) : vulnérabilités High/Critical bloquantes ;
  #   - SBOM CycloneDX généré et archivé (inventaire des composants).
  # ==========================================================================
  supply-chain:
    name: Supply-chain — pins + audits vulnérabilités + SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install audit tools
        run: pip install pip-audit pyyaml

      - name: Pins Docker (digest commités == Docker Hub)
        working-directory: backend
        run: python scripts/check_docker_pins.py

      - name: pip-audit (dépendances Python — bloquant)
        working-directory: backend
        run: pip-audit -r requirements.txt

      - name: npm audit (dépendances JS — bloquant High/Critical)
        working-directory: frontend
        run: npm audit --audit-level=high

      # NB : le tag `0.28.0` (sans préfixe `v`) n'existe plus — les tags de
      # trivy-action sont désormais préfixés `v` (ex. v0.36.0), ce qui cassait
      # la résolution de l'action au stade "Getting action download info".
      # On référence par SHA complet immuable + commentaire de version : bonne
      # pratique supply-chain, alignée avec l'objectif même de ce job (pins).
      - name: Trivy (FS — bloquant High/Critical)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: "true"
          skip-dirs: backend/venv,frontend/node_modules,backend/experiments,backend/data,backend/.venv

      - name: SBOM CycloneDX (inventaire — non bloquant)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: cyclonedx
          output: sbom-cyclonedx.json
          skip-dirs: backend/venv,frontend/node_modules,backend/experiments,backend/data,backend/.venv

      - name: Upload SBOM (artefact d'audit)
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom-cyclonedx.json
