worker_processes auto;
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    sendfile on;
    keepalive_timeout 65;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # P0 SEC (F7) : throttle mutualisé — la zone DOIT vivre dans http{}
    # (limit_req_zone interdit dans server{}). Consommée par les locations
    # /api/ et /mcp/ du template (default.conf.template).
    limit_req_zone $binary_remote_addr zone=api_burst:10m rate=30r/s;

    include /etc/nginx/conf.d/*.conf;
}
