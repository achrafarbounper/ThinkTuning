model_name: distilbert-base-multilingual-cased

max_length: 160

learning_rate: 3e-5
weight_decay: 0.01
warmup_ratio: 0.1

epochs: 4
batch_size: 8 #16

# Early stopping : arrêt si le F1 de validation ne s'améliore pas pendant
# `patience` epochs consécutives (patience <= 0 = désactivé).
early_stopping_patience: 3
early_stopping_min_delta: 0.0

device: auto
gradient_clip: 1.0

# Régularisation pendant l'entraînement (dans _train_epoch)
# Epsilon du label smoothing (0.0 = désactivé). Utilisé via
# nn.CrossEntropyLoss(label_smoothing=epsilon).
label_smoothing: 0.1
# Paramètre alpha de la distribution Beta de Mixup (0.0 = désactivé).
# Mixup combine la loss sur les vrais labels et sur un batch permuté.
mixup_alpha: 0.4

num_workers: 0

# Pondération des classes lors de la sélection des exemples à augmenter
# (label -> poids). Un poids plus élevé rend la classe préférentiellement
# augmentée. La classe neutral (label 1), typiquement sous-représentée dans le
# corpus, est surpondérée par défaut pour être surreprésentée après
# l'augmentation EDA.
class_augment_weights:
  0: 1.0
  1: 2.0
  2: 1.0

# Sanity check comportemental du modèle (SCRUM-74) : seuil minimal de
# confidence. Si la confidence max du modèle reste sous ce seuil sur toutes
# les phrases de référence FR/EN (softmax quasi uniforme ≈ 1/3), le modèle
# est considéré non entraîné et l'API retourne une erreur explicite.
# Surchargeable via la variable d'environnement MODEL_SANITY_MIN_CONFIDENCE.
model_sanity_min_confidence: 0.4
